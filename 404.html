<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Cody Boillot</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b0f17; --card:#141b2b; --line:rgba(255,255,255,.14); --text:#eef2f9;
          --muted:#9aa6bd; --grad:linear-gradient(100deg,#ffc24b 0%,#ff8a3d 45%,#ff5e62 100%); }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:2rem;
         background:var(--bg); color:var(--text); text-align:center;
         font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; line-height:1.6; }
  body::before { content:""; position:fixed; inset:0; z-index:-1; background:
    radial-gradient(720px 480px at 78% -8%, rgba(255,138,61,.16), transparent 60%),
    radial-gradient(900px 600px at 50% 120%, rgba(255,194,75,.08), transparent 60%); }
  h1 { font-family:"Sora",sans-serif; font-size:clamp(2.4rem,9vw,4rem); margin:0 0 .4rem;
       background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  h2 { font-family:"Sora",sans-serif; font-size:1.2rem; margin:0 0 .8rem; }
  p { color:var(--muted); margin:0 auto 1.6rem; max-width:46ch; }
  .row { display:flex; gap:.7rem; justify-content:center; flex-wrap:wrap; }
  a.btn { display:inline-flex; align-items:center; padding:.75rem 1.3rem; border-radius:999px;
          font-weight:600; font-size:.95rem; text-decoration:none; border:1px solid transparent; }
  .primary { background:var(--grad); color:#1a1206; }
  .ghost { background:var(--card); border-color:var(--line); color:var(--text); }
  code { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:.1em .4em; font-size:.9em; }
</style>
<script>
  /* GitHub Pages paths are case-sensitive. Windows cannot hold two directories
     that differ only by case, so a lowercase redirect stub is impossible in the
     working tree. This catches the same mistake from one place instead, and
     covers every known path rather than just one. */
  (function () {
    var KNOWN = ["/SkillTrainer/", "/ClickToConquer/", "/FactoryAFK/", "/BattlePass/", "/Singularity/", "/games/"];
    var here = location.pathname.replace(/\/+$/, "").toLowerCase();
    for (var i = 0; i < KNOWN.length; i++) {
      var target = KNOWN[i];
      if (here === target.replace(/\/+$/, "").toLowerCase()) {
        location.replace(target + location.search + location.hash);
        return;
      }
    }
  })();
</script>
</head>
<body>
  <main>
    <h1>404</h1>
    <h2>That page is not here</h2>
    <p>The link may be out of date, or the address may have a typo in it. Everything lives off the home page.</p>
    <div class="row">
      <a class="btn primary" href="/">Home</a>
      <a class="btn ghost" href="/SkillTrainer/">SkillTrainer demo</a>
    </div>
  </main>
</body>
</html>
