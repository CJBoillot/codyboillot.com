<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Night Scoreboard</title>
<meta name="description" content="Keep score for up to 12 players with a game clock and a hold-to-buzz buzzer. Scores stay saved in your browser.">
<meta name="theme-color" content="#eceef3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1322" media="(prefers-color-scheme: dark)">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a gym scoreboard that fills one phone screen. Clock panel pinned on top,
   player lanes share whatever height is left so every score shows at once. */
:root{
  --bg:#eceef3;
  --surface:#ffffff;
  --ink:#141a2b;
  --muted:#5d6579;
  --line:#d3d8e3;
  --accent:#d9481f;
  --accent-ink:#ffffff;
  --good:#1f8a4c;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1322;--surface:#182038;--ink:#f1f3f9;--muted:#9aa3bb;--line:#2c3556;
    --accent:#ff7a4d;--accent-ink:#1c0d06;--good:#4fd08a;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1322;--surface:#182038;--ink:#f1f3f9;--muted:#9aa3bb;--line:#2c3556;
  --accent:#ff7a4d;--accent-ink:#1c0d06;--good:#4fd08a;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
@supports (height:100dvh){html,body{height:100dvh}}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  -webkit-tap-highlight-color:transparent;overflow:hidden}
main{height:100%;max-width:720px;margin:0 auto;padding:10px 16px 12px;display:flex;flex-direction:column;gap:8px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none !important}

.label{font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* Clock panel: never scrolls away */
.clock{flex:none;position:sticky;top:0;z-index:2;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.clock-main{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.time{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;line-height:.9;
  font-size:clamp(2.75rem,13vw,4.5rem);letter-spacing:.01em}
.time small{font-size:.45em;font-weight:600;color:var(--muted)}
.clock.running .time{color:var(--accent)}
.clock.done .time{animation:flash .5s steps(2) 6}
@keyframes flash{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.clock.done .time{animation:none;color:var(--accent)}}
.clock-btns{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-weight:600;min-height:48px;min-width:64px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);min-width:84px}
.btn:active{transform:translateY(1px)}
.clock-tools{display:grid;grid-template-columns:1fr auto;gap:8px}
.buzzer{border:0;border-radius:10px;min-height:52px;background:var(--ink);color:var(--bg);
  font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:.14em;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.buzzer:active,.buzzer.on{background:var(--accent);color:var(--accent-ink);transform:scale(.985)}
.btn[aria-expanded="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Setup drawer */
.setup{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end;border-top:1px solid var(--line);padding-top:10px}
.group{display:flex;flex-direction:column;gap:5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;background:var(--bg)}
.seg button{border:0;background:transparent;border-radius:7px;padding:0 12px;height:36px;font-size:.875rem;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.setrow{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.85rem}
.setrow input{width:56px;height:44px;text-align:center;padding:4px;border:1px solid var(--line);border-radius:8px;background:var(--bg);
  font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.setrow input:disabled{opacity:.5}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}
.stepper button{border:0;background:transparent;width:44px;height:42px;font-size:1.3rem;font-weight:600}
.stepper button:disabled{opacity:.3}
.stepper output{min-width:36px;text-align:center;font-family:var(--display);font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums}
.chips{display:inline-flex;gap:6px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:10px;min-width:44px;height:44px;padding:0 10px;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.link{border:0;background:transparent;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:12px 0;font-size:.9rem}
.link.arm{color:var(--accent);font-weight:600}

/* Lanes: split the remaining height evenly */
.lanes{flex:1;min-height:0;overflow-y:auto;list-style:none;margin:0;padding:8px 0 0;
  display:grid;grid-template-columns:repeat(var(--cols,1),minmax(0,1fr));grid-auto-rows:minmax(58px,1fr);gap:9px}
.lane{--hue:var(--accent);position:relative;container-type:size;background:var(--surface);border:1px solid var(--line);
  border-left:7px solid var(--hue);border-radius:12px;padding:6px 6px 6px 7px;
  display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:6px;align-items:center}
.lane.leading{border-color:var(--good);border-left-color:var(--hue)}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
.name{width:100%;border:0;background:transparent;text-align:center;font-weight:500;font-size:.8rem;line-height:1.2;
  padding:0 2px;color:var(--muted);border-radius:4px;text-overflow:ellipsis}
.name:focus{color:var(--ink);outline:none;background:var(--bg)}
.score{font-family:var(--display);font-weight:800;line-height:.95;font-variant-numeric:tabular-nums;font-size:2.2rem;
  font-size:clamp(1.5rem,min(52cqh,36cqw),6rem)}
.lead{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--good);color:var(--surface);
  font-size:.6rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;line-height:1;padding:3px 7px;border-radius:999px}
.lead:empty{display:none}
.pm{width:44px;height:100%;max-height:76px;border-radius:10px;border:1px solid var(--line);background:var(--bg);
  font-size:1.6rem;font-weight:600;line-height:1;padding:0}
.pm.plus{background:var(--hue);border-color:var(--hue);color:#fff}
.pm:active{transform:scale(.95)}
</style>
</head>
<body>
<main>
  <section class="clock" id="clock" aria-label="Timer">
    <div class="clock-main">
      <div class="time" id="time" role="timer" aria-live="off">00:00<small>.0</small></div>
      <div class="clock-btns">
        <button type="button" class="btn primary" id="startstop">Start</button>
        <button type="button" class="btn" id="reset-clock">Reset</button>
      </div>
    </div>
    <div class="clock-tools">
      <button type="button" class="buzzer" id="buzzer">BUZZER</button>
      <button type="button" class="btn" id="setup-toggle" aria-expanded="false" aria-controls="setup">Setup</button>
    </div>

    <div class="setup" id="setup" hidden>
      <div class="group">
        <span class="label" id="lbl-count">Players</span>
        <div class="stepper" role="group" aria-labelledby="lbl-count">
          <button type="button" id="count-down" aria-label="Remove a player">−</button>
          <output id="count">2</output>
          <button type="button" id="count-up" aria-label="Add a player">+</button>
        </div>
      </div>
      <div class="group">
        <span class="label" id="lbl-step">Points per tap</span>
        <div class="chips" id="chips" role="group" aria-labelledby="lbl-step">
          <button type="button" data-step="1">1</button>
          <button type="button" data-step="5">5</button>
          <button type="button" data-step="10">10</button>
        </div>
      </div>
      <div class="group">
        <span class="label" id="lbl-mode">Clock</span>
        <div class="seg" role="group" aria-labelledby="lbl-mode">
          <button type="button" id="mode-up" aria-pressed="true">Stopwatch</button>
          <button type="button" id="mode-down" aria-pressed="false">Countdown</button>
        </div>
      </div>
      <div class="setrow" id="setrow" hidden>
        <label for="set-min">Min</label><input id="set-min" type="number" inputmode="numeric" min="0" max="599" value="5">
        <label for="set-sec">Sec</label><input id="set-sec" type="number" inputmode="numeric" min="0" max="59" value="0">
      </div>
      <button type="button" class="link" id="reset-scores">Reset all scores to 0</button>
    </div>
  </section>

  <ul class="lanes" id="lanes"></ul>
</main>

<script>
(function(){
  var HUES=["#d9481f","#2563c9","#1f8a4c","#a23bbf","#c98a06","#0f8f9c","#d0336b","#5b5fd6","#6f8f1c","#b0562b","#3d7fa8","#8a4a9e"];
  var KEY="scoreboard-v1", MAX=12;
  var state, audio, tick, armTimer, buzzTimer;
  var $=function(id){return document.getElementById(id)};

  function fresh(){return {players:[{name:"Player 1",score:0},{name:"Player 2",score:0}],step:1,mode:"up",dur:300,elapsed:0,startedAt:null,done:false}}
  function load(d){
    var s=fresh();
    try{
      if(!d||!d.players){d=JSON.parse(localStorage.getItem(KEY)||"null")}
    }catch(e){d=null}
    if(d&&Array.isArray(d.players)&&d.players.length){
      s.players=d.players.slice(0,MAX).map(function(p,i){return {name:String(p.name||("Player "+(i+1))).slice(0,24),score:Number(p.score)||0}});
      s.step=[1,5,10].indexOf(d.step)>=0?d.step:1;
      s.mode=d.mode==="down"?"down":"up";
      s.dur=Math.max(1,Number(d.dur)||300);
      s.elapsed=Math.max(0,Number(d.elapsed)||0);
      s.startedAt=typeof d.startedAt==="number"?d.startedAt:null;
      s.done=!!d.done;
    }
    return s;
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
  function wake(){
    try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==="suspended")audio.resume()}catch(e){}
  }

  /* ---------- clock ---------- */
  function elapsedNow(){return state.elapsed+(state.startedAt?Date.now()-state.startedAt:0)}
  function shownMs(){return state.mode==="down"?Math.max(0,state.dur*1000-elapsedNow()):elapsedNow()}
  function pad(n){return (n<10?"0":"")+n}
  function paintTime(){
    var ms=shownMs();
    // countdown rounds up so it reads 5:00 at the start and hits 0 exactly at the end
    var tenths=state.mode==="down"?Math.ceil(ms/100):Math.floor(ms/100);
    var t=tenths%10, sec=Math.floor(tenths/10), s=sec%60, m=Math.floor(sec/60)%60, h=Math.floor(sec/3600);
    $("time").innerHTML=(h?h+":":"")+pad(m)+":"+pad(s)+"<small>."+t+"</small>";
  }
  function paintClock(){
    var running=!!state.startedAt;
    $("clock").classList.toggle("running",running);
    $("clock").classList.toggle("done",state.done);
    $("mode-up").setAttribute("aria-pressed",state.mode==="up");
    $("mode-down").setAttribute("aria-pressed",state.mode==="down");
    $("setrow").hidden=state.mode!=="down";
    var locked=running||state.elapsed>0;
    $("set-min").disabled=locked;$("set-sec").disabled=locked;
    if(document.activeElement!==$("set-min"))$("set-min").value=Math.floor(state.dur/60);
    if(document.activeElement!==$("set-sec"))$("set-sec").value=state.dur%60;
    $("startstop").textContent=running?"Pause":(state.elapsed>0&&!state.done?"Resume":"Start");
    paintTime();
  }
  function loop(){
    clearInterval(tick);
    if(!state.startedAt)return;
    tick=setInterval(function(){
      if(state.mode==="down"&&shownMs()<=0){finish();return}
      paintTime();
    },50);
  }
  function start(){
    if(state.done||(state.mode==="down"&&shownMs()<=0)){state.elapsed=0;state.done=false}
    wake();
    state.startedAt=Date.now();save();paintClock();loop();
  }
  function pause(){
    state.elapsed=elapsedNow();state.startedAt=null;clearInterval(tick);save();paintClock();
  }
  function finish(){
    state.elapsed=state.dur*1000;state.startedAt=null;state.done=true;clearInterval(tick);save();paintClock();beep();
  }
  function resetClock(){
    state.elapsed=0;state.startedAt=null;state.done=false;clearInterval(tick);save();paintClock();
  }
  function beep(){
    try{
      if(!audio)return;
      for(var i=0;i<3;i++){
        var o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.35;
        o.type="square";o.frequency.value=880;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.28);
        o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.3);
      }
    }catch(e){}
  }
  /* Buzzer: sound only. It never reads or changes the clock. */
  var buzzing=null, buzzAt=0;
  function startBuzz(){
    if(buzzing)return;
    wake();
    $("buzzer").classList.add("on");
    buzzing={g:null,oscs:[],locked:true};buzzAt=Date.now();
    try{
      if(audio){
        var t=audio.currentTime, g=audio.createGain();
        g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.3,t+.02);
        g.connect(audio.destination);
        buzzing.g=g;buzzing.locked=audio.state!=="running";
        [["sawtooth",118],["sawtooth",122],["square",59]].forEach(function(v){
          var o=audio.createOscillator();o.type=v[0];o.frequency.value=v[1];o.connect(g);o.start(t);buzzing.oscs.push(o);
        });
      }
    }catch(e){}
  }
  function stopBuzz(){
    if(!buzzing)return;
    var n=buzzing;buzzing=null;
    $("buzzer").classList.remove("on");
    try{
      if(!n.g)return;
      // A quick tap still gets a short buzz. If the phone only unlocks sound on release, play it then.
      var hold=n.locked?.4:Math.max(0,.25-(Date.now()-buzzAt)/1000);
      if(n.locked)wake();
      var t=audio.currentTime+hold;
      n.g.gain.cancelScheduledValues(audio.currentTime);
      n.g.gain.setValueAtTime(.3,audio.currentTime);
      n.g.gain.setValueAtTime(.3,t);n.g.gain.linearRampToValueAtTime(.0001,t+.04);
      n.oscs.forEach(function(o){o.stop(t+.06)});
    }catch(e){}
  }
  function readDur(){
    var m=Math.max(0,Math.min(599,parseInt($("set-min").value,10)||0));
    var s=Math.max(0,Math.min(59,parseInt($("set-sec").value,10)||0));
    state.dur=Math.max(1,m*60+s);save();paintTime();
  }

  /* ---------- scores ---------- */
  function paintLead(){
    var sc=state.players.map(function(p){return p.score});
    var hi=Math.max.apply(null,sc), lo=Math.min.apply(null,sc);
    var items=$("lanes").children;
    for(var i=0;i<items.length;i++){
      var lead=hi!==lo&&state.players[i].score===hi;
      items[i].classList.toggle("leading",lead);
      items[i].querySelector(".score").textContent=state.players[i].score;
      items[i].querySelector(".lead").textContent=lead?"Leading":"";
    }
  }
  function buildLanes(){
    var ul=$("lanes"), n=state.players.length;ul.textContent="";
    ul.style.setProperty("--cols",n>4?2:1);
    state.players.forEach(function(p,i){
      var li=document.createElement("li");li.className="lane";li.style.setProperty("--hue",HUES[i%HUES.length]);
      var minus=document.createElement("button");minus.type="button";minus.className="pm";minus.textContent="−";
      minus.setAttribute("aria-label","Take points from "+p.name);
      var plus=document.createElement("button");plus.type="button";plus.className="pm plus";plus.textContent="+";
      plus.setAttribute("aria-label","Give points to "+p.name);
      var mid=document.createElement("div");mid.className="mid";
      var name=document.createElement("input");name.className="name";name.id="name-"+i;name.type="text";name.maxLength=24;name.value=p.name;
      name.setAttribute("aria-label","Name of player "+(i+1));name.autocomplete="off";
      var score=document.createElement("div");score.className="score";score.setAttribute("aria-live","polite");
      var lead=document.createElement("span");lead.className="lead";
      mid.appendChild(name);mid.appendChild(score);
      li.appendChild(minus);li.appendChild(mid);li.appendChild(plus);li.appendChild(lead);ul.appendChild(li);
      minus.addEventListener("click",function(){p.score-=state.step;save();paintLead()});
      plus.addEventListener("click",function(){p.score+=state.step;save();paintLead()});
      name.addEventListener("input",function(){p.name=name.value;save()});
      name.addEventListener("focus",function(){name.select()});
      name.addEventListener("blur",function(){if(!name.value.trim()){p.name=name.value="Player "+(i+1);save()}});
      name.addEventListener("keydown",function(e){if(e.key==="Enter")name.blur()});
    });
    $("count").textContent=n;
    $("count-down").disabled=n<=1;
    $("count-up").disabled=n>=MAX;
    paintLead();
  }
  function paintStep(){
    var b=$("chips").children;
    for(var i=0;i<b.length;i++)b[i].setAttribute("aria-pressed",Number(b[i].dataset.step)===state.step);
  }

  /* ---------- wire up ---------- */
  function boot(data){
    state=load(data);
    // cancel any vibration left running by an earlier version
    try{navigator.vibrate&&navigator.vibrate(0)}catch(e){}
    // a countdown that ran out while the page was closed
    if(state.startedAt&&state.mode==="down"&&shownMs()<=0){state.elapsed=state.dur*1000;state.startedAt=null;state.done=true}
    buildLanes();paintStep();paintClock();loop();

    $("startstop").addEventListener("click",function(){state.startedAt?pause():start()});
    $("reset-clock").addEventListener("click",resetClock);
    var bz=$("buzzer");
    bz.addEventListener("pointerdown",function(e){e.preventDefault();try{bz.setPointerCapture(e.pointerId)}catch(x){}startBuzz()});
    ["pointerup","pointercancel","lostpointercapture","blur"].forEach(function(ev){bz.addEventListener(ev,stopBuzz)});
    bz.addEventListener("contextmenu",function(e){e.preventDefault()});
    bz.addEventListener("keydown",function(e){if((e.key===" "||e.key==="Enter")&&!e.repeat){e.preventDefault();startBuzz()}});
    bz.addEventListener("keyup",function(e){if(e.key===" "||e.key==="Enter")stopBuzz()});
    window.addEventListener("blur",stopBuzz);
    document.addEventListener("visibilitychange",function(){if(document.hidden)stopBuzz()});
    document.addEventListener("pointerup",wake);
    $("setup-toggle").addEventListener("click",function(){
      var open=$("setup").hidden;$("setup").hidden=!open;
      this.setAttribute("aria-expanded",open);this.textContent=open?"Done":"Setup";
    });
    $("mode-up").addEventListener("click",function(){if(state.mode!=="up"){state.mode="up";resetClock()}});
    $("mode-down").addEventListener("click",function(){if(state.mode!=="down"){state.mode="down";resetClock()}});
    $("set-min").addEventListener("input",readDur);
    $("set-sec").addEventListener("input",readDur);
    $("set-min").addEventListener("blur",paintClock);
    $("set-sec").addEventListener("blur",paintClock);

    $("count-up").addEventListener("click",function(){
      if(state.players.length<MAX){state.players.push({name:"Player "+(state.players.length+1),score:0});save();buildLanes()}
    });
    $("count-down").addEventListener("click",function(){
      if(state.players.length>1){state.players.pop();save();buildLanes()}
    });
    $("chips").addEventListener("click",function(e){
      var b=e.target.closest("button");if(!b)return;state.step=Number(b.dataset.step);save();paintStep();
    });
    var rs=$("reset-scores");
    rs.addEventListener("click",function(){
      if(rs.classList.contains("arm")){
        state.players.forEach(function(p){p.score=0});save();paintLead();disarm();
      }else{
        rs.classList.add("arm");rs.textContent="Tap again to clear every score";armTimer=setTimeout(disarm,3000);
      }
    });
    function disarm(){clearTimeout(armTimer);rs.classList.remove("arm");rs.textContent="Reset all scores to 0"}
    document.addEventListener("visibilitychange",function(){if(!document.hidden)paintClock()});
    try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(function(){return state})}catch(e){}
  }
  var hot=window.claude&&window.claude.hot;
  if(hot&&hot.ready){hot.ready(boot)}else{boot((hot&&hot.data)||{})}
})();
</script>
</body>
</html>
