<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-label="A layered architecture: interface, application, domain and infrastructure, with dependencies pointing inward toward the domain.">
  <!-- Colours are chosen to read on both the dark and light themes, since an
       SVG loaded via <img> cannot inherit the page's CSS custom properties. -->
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffc24b"/>
      <stop offset="45%" stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#ff5e62"/>
    </linearGradient>
  </defs>

  <g font-family="Inter, system-ui, sans-serif" fill="#8b93a5">
    <rect x="40" y="26" width="420" height="58" rx="10" fill="none" stroke="#8b93a5" stroke-width="1.5"/>
    <text x="60" y="52" font-size="15" font-weight="600" fill="#8b93a5">Interface</text>
    <text x="60" y="72" font-size="12">HTTP handlers, CLI, UI. Knows about the outside world.</text>

    <rect x="40" y="98" width="420" height="58" rx="10" fill="none" stroke="#8b93a5" stroke-width="1.5"/>
    <text x="60" y="124" font-size="15" font-weight="600" fill="#8b93a5">Application</text>
    <text x="60" y="144" font-size="12">Use cases. Orchestrates the domain, owns no rules itself.</text>

    <rect x="40" y="170" width="420" height="58" rx="10" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
    <text x="60" y="196" font-size="15" font-weight="700" fill="#ff8a3d">Domain</text>
    <text x="60" y="216" font-size="12">The rules that would still be true on paper. Depends on nothing.</text>

    <rect x="40" y="242" width="420" height="58" rx="10" fill="none" stroke="#8b93a5" stroke-width="1.5"
          stroke-dasharray="5 4"/>
    <text x="60" y="268" font-size="15" font-weight="600" fill="#8b93a5">Infrastructure</text>
    <text x="60" y="288" font-size="12">Database, queues, third parties. Plugged in, never depended on.</text>

    <!-- Dependency arrows, all pointing at the domain -->
    <g stroke="#ff8a3d" stroke-width="1.6" fill="none">
      <path d="M490 55 L520 55 L520 190 L470 190" marker-end="url(#tip)"/>
      <path d="M490 127 L505 127 L505 190 L470 190" marker-end="url(#tip)"/>
      <path d="M490 271 L520 271 L520 199 L470 199" marker-end="url(#tip)"/>
    </g>
    <text x="536" y="186" font-size="12" fill="#ff8a3d">depends</text>
    <text x="536" y="202" font-size="12" fill="#ff8a3d">on</text>
  </g>

  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff8a3d"/>
    </marker>
  </defs>
</svg>
